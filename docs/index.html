<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFB627">
  <title>Cartoon Time</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main id="kids">
    <div class="sticky">
      <header class="top">
        <h1>Cartoon time</h1>
        <button id="reset" class="round" aria-label="Start over">↺</button>
        <button id="gear" class="round quiet" aria-label="Parent settings (hold)">⚙</button>
      </header>

      <div id="bar" class="bar" aria-label="Chosen cartoons"></div>
      <div id="status" class="status"></div>

      <div id="kidsRow" class="kids-row"></div>
      <p id="hint" class="hint"></p>
      <button id="fill" class="pill fill" hidden></button>
    </div>

    <div id="cards" class="cards"></div>
  </main>

  <main id="parents" hidden>
    <header class="top">
      <button id="back" class="pill">← Done</button>
      <h1>Parents</h1>
    </header>

    <section class="panel">
      <h2>Add a cartoon</h2>
      <form id="searchForm" class="search">
        <input id="q" type="search" placeholder="Series or movie name" autocomplete="off" required>
        <button class="pill strong">Search</button>
      </form>
      <div id="results" class="rows"></div>
    </section>

    <section class="panel">
      <h2>Our cartoons</h2>
      <div id="list" class="rows"></div>
    </section>

    <section class="panel">
      <h2>Settings</h2>
      <div id="settings"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
